    name: Update Readme with WakaTime stats
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ waka_2b6c4f15-336c-4245-89b2-07cbe5ad57c3 }}
